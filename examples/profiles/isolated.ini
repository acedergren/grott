# Isolated read-only dev profile for acedergren/grott.
# This is not a cloud-independent mode. Proxy and sniff still depend on the
# Growatt path when noforward is left at its default (False).
# This file turns forwarding off on purpose, disables external outputs,
# blocks write commands, and binds the listen socket to loopback.
# Do not use it as a drop-in for an existing cloud-forwarding installation.
# Secrets, when an output is later enabled, are read from files. Nothing in
# this profile contains a credential.

[Generic]
verbose = False
mode = proxy
ip = 127.0.0.1
port = 5279
blockcmd = True
noforward = True
sendbuf = False

[Growatt]
# Ignored while noforward is True. Kept so the cloud dependency stays visible.
ip = server.growatt.com
port = 5279

[MQTT]
nomqtt = True
# password_file = /run/secrets/mqtt_password

[PVOutput]
pvoutput = False
# apikey_file = /run/secrets/pvoutput_apikey

[influx]
influx = False
influx2 = False
# password_file = /run/secrets/influx_password
# token_file = /run/secrets/influx_token

[extension]
extension = False
